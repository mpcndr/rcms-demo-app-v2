<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCMS — Registration and Capital Monitoring System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --m-dark:#08324D; --m:#0F5C8C; --m-light:#5FA3CC; --m-lite:#EAF2F8;
  --ink:#0E2233; --ink2:#33495E; --muted:#6C7F91;
  --line:#DBE3EA; --soft:#EFF3F7; --paper:#F4F7FA; --white:#fff;
  --ok:#1B6E45; --okbg:#E7F2EC; --warn:#B06A05; --warnbg:#FCF1DF;
  --bad:#B03127; --badbg:#FBEAE8; --idle:#5E6B7E; --idlebg:#EEF1F5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans','Noto Sans Lao',system-ui,sans-serif;background:var(--paper);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
body.lo{font-family:'Noto Sans Lao','IBM Plex Sans',system-ui,sans-serif}
body.lo .app,body.lo .login{line-height:1.7}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit}
#frame{height:100vh}

.app{display:flex;height:100vh;overflow:hidden}
.side{width:224px;flex:0 0 224px;background:var(--m-dark);color:#B9CEDD;padding:14px 10px;
  overflow-y:auto;transition:width .18s,flex-basis .18s}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:#1A5476;border-radius:3px}
.app.mini .side{width:62px;flex:0 0 62px}
.app.mini .side .lbl,.app.mini .side .sect,.app.mini .side .brand{display:none}
.sh{display:flex;align-items:center;gap:9px;padding:2px 6px 16px}
.burger{width:32px;height:32px;flex:0 0 32px;border:0;border-radius:6px;background:#12486B;color:#DCE9F2;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.burger:hover{background:#1A5D87}
.brand{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.02em;display:flex;align-items:center}
.sect{font-size:9.5px;color:#6E93AD;letter-spacing:.09em;padding:12px 8px 5px;font-weight:500;text-transform:uppercase}
.mi{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:#B2C6D6;margin-bottom:1px}
.mi:hover{background:#12486B;color:#fff}
.mi.on{background:var(--m);color:#fff;font-weight:600}
.mi .ic{width:18px;flex:0 0 18px;text-align:center;font-size:14px}
.mi .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:600}
.mi.soon{opacity:.48}
.mi.sub{padding-left:36px;font-size:11.5px;color:#93AAC0}
.mi.sub.on{background:#12486B;color:#fff;font-weight:600}
.app.mini .mi.sub{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--white);border-bottom:1px solid var(--line);padding:11px 24px;
  display:flex;align-items:center;gap:14px;flex:0 0 auto;z-index:20}
.crumb{font-size:11px;color:var(--muted);cursor:pointer}
.crumb:hover{color:var(--m)}
.title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:11px}
.lang span{padding:5px 11px;cursor:pointer;color:var(--muted)}
.lang span:hover{background:var(--m-lite)}
.lang span.on{background:var(--m);color:#fff;font-weight:600}
.bellwrap{position:relative}
.bell{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink2);cursor:pointer;border:1px solid transparent}
.bell:hover{background:var(--m-lite)}
.bell.open{background:var(--m-lite);border-color:#C8DDEC}
.bell b{position:absolute;top:1px;right:1px;background:var(--bad);color:#fff;font-size:8.5px;
  border-radius:8px;padding:0 4px;font-weight:600;line-height:1.5}
.panel{position:absolute;right:0;top:40px;width:344px;background:var(--white);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 14px 40px rgba(8,50,77,.19);z-index:60;overflow:hidden}
.panel .ph{padding:11px 14px;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:8px}
.panel .ph h4{font-size:12.5px;font-weight:600}
.panel .ph span{margin-left:auto;font-size:10.5px;color:var(--m);cursor:pointer}
.panel .pb{max-height:330px;overflow-y:auto}
.nrow{padding:11px 14px;border-bottom:1px solid var(--soft);display:flex;gap:10px;cursor:pointer}
.nrow:hover{background:var(--m-lite)}
.nrow:last-child{border-bottom:0}
.nrow .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:5px}
.nrow .nt{font-size:11.5px;font-weight:600;line-height:1.5}
.nrow .ns{font-size:10.5px;color:var(--muted);line-height:1.65;margin-top:2px}
.nrow .nx{font-size:9.5px;color:var(--muted);margin-top:4px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--m-lite);color:var(--m);font-size:10px;
  font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid #C8DDEC;cursor:pointer}
.uinfo{text-align:right;font-size:10.5px;line-height:1.45}
.uinfo b{color:var(--ink)} .uinfo span{color:var(--muted)}

.body{padding:20px 24px 32px;flex:1;overflow-y:auto;background:var(--paper)}
.wrap{max-width:1440px;margin:0 auto}

.alert{background:var(--badbg);border:1px solid #F0CBC6;border-left:3px solid var(--bad);border-radius:7px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.alert .t{font-size:12.5px;color:var(--bad);font-weight:600}
.alert .s{font-size:11.5px;color:#8A4C45}
.alert button{margin-left:auto;background:var(--bad);color:#fff;border:0;border-radius:5px;padding:7px 12px;font-size:11.5px;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sel,.inp{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  font-size:11.5px;color:var(--ink2);font-family:inherit;min-width:0}
select.sel{cursor:pointer;height:33px;flex:0 1 190px}
.inp{flex:0 1 280px}
.sel:focus,.inp:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(15,92,140,.15)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--m-light);box-shadow:0 3px 14px rgba(15,92,140,.1);transform:translateY(-1px)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m-light)}
.kpi.ok:before{background:var(--ok)} .kpi.warn:before{background:var(--warn)} .kpi.bad:before{background:var(--bad)}
.kpi .k{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.03em}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.kpi .d{font-size:10.5px;color:var(--muted);margin-top:4px}
@keyframes flash{0%{background:var(--m-lite)}100%{background:var(--white)}}
.flash{animation:flash 1.5s ease-out}
.dkpi{box-shadow:0 1px 2px rgba(8,50,77,.05)}
.dkpi .ic{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--m-lite);color:var(--m)}
.dkpi.ok .ic{background:var(--okbg);color:var(--ok)}
.dkpi.warn .ic{background:var(--warnbg);color:var(--warn)}
.dkpi.bad .ic{background:var(--badbg);color:var(--bad)}
.dlegend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:200px}
.dlegend .row{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;padding:8px 10px;
  border-radius:7px;background:var(--soft);font-size:11px;transition:.15s}
.dlegend .row:hover{background:var(--m-lite)}
.dlegend .row .bar{position:absolute;left:0;top:0;bottom:0;opacity:.16;border-radius:7px 0 0 7px}
.dlegend .row i{width:9px;height:9px;border-radius:3px;flex:0 0 auto;position:relative}
.dlegend .row .nm{flex:1;color:var(--ink2);position:relative}
.dlegend .row .ct{font-weight:600;color:var(--ink);font-family:'IBM Plex Mono',monospace;position:relative}
.dlegend .row .pc{font-size:10px;color:var(--muted);min-width:32px;text-align:right;position:relative}
.dstat{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-width:220px;align-content:center}
.dstat .cell{background:var(--soft);border-radius:9px;padding:12px 14px}
.dstat .cell .k{font-size:10.5px;color:var(--muted);margin-bottom:5px}
.dstat .cell .v{font-size:16.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em}
.hero{background:linear-gradient(135deg,var(--m-dark),var(--m));border-radius:12px;padding:22px 26px;
  display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-bottom:16px;color:#fff}
.hero .hpct{font-size:42px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em;line-height:1}
.hero .hpctl{font-size:10.5px;color:#BBD3E8;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.hero .hstats{display:flex;gap:30px;flex-wrap:wrap;flex:1}
.hero .hstat .k{font-size:10.5px;color:#BBD3E8;margin-bottom:5px}
.hero .hstat .v{font-size:18px;font-weight:600;font-family:'IBM Plex Mono',monospace}
@media(max-width:640px){.hero{padding:18px}}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:9px}
.card .h{padding:13px 16px 0;display:flex;align-items:baseline;gap:10px}
.card .h h3{font-size:12.5px;font-weight:600}
.card .h .more{margin-left:auto;font-size:11px;color:var(--m);cursor:pointer}
.card .c{padding:14px 16px 16px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--ink2)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.legend b{font-weight:600;color:var(--ink)}
.upanel{position:absolute;right:0;top:42px;width:236px;background:var(--white);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 14px 40px rgba(8,50,77,.19);z-index:60;overflow:hidden}
.upanel .uh{padding:13px 15px;border-bottom:1px solid var(--soft)}
.upanel .uh .t2{font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.upanel .uh .n2{font-size:12.5px;font-weight:600;margin-top:4px}
.upanel .uh .r2{font-size:10.5px;color:var(--muted);margin-top:2px}
.upanel .ui{padding:11px 15px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--ink2)}
.upanel .ui:hover{background:var(--m-lite)}
.upanel .ui.out{color:var(--bad);border-top:1px solid var(--soft)}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;padding:9px 11px;background:var(--m-lite);border-bottom:1px solid var(--line)}
td{padding:10px 11px;border-bottom:1px solid var(--soft);color:var(--ink2)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--m-lite)}
.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.pill i{font-style:normal;font-size:8.5px;opacity:.6;margin-left:5px;font-weight:500}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)} .p-idle{background:var(--idlebg);color:var(--idle)}
.p-rev{background:var(--m-lite);color:var(--m)}
.co{font-weight:500;color:var(--ink)}
.co small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:1px}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:12px}
.empty b{display:block;color:var(--ink2);font-size:13px;margin-bottom:5px}

.capcard{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:12px}
.capcard .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.capcard h3{font-size:12.5px;font-weight:600}
.donutrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}

.btn{background:var(--m);color:#fff;border:0;border-radius:6px;padding:9px 15px;font-size:12px;cursor:pointer}
.btn:hover{background:var(--m-dark)}
.btn.ghost{background:var(--white);border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{background:var(--m-lite);border-color:var(--m-light)}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger:hover{background:#8F231C}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kv{font-size:11.5px}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--soft)}
.kv>div:last-child{border:0}
.kv .k{color:var(--muted);flex-shrink:0} .kv .v{font-weight:500;text-align:right}
.reglist{border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:1.3;min-width:280px}
.regrow{display:flex;justify-content:space-between;gap:14px;padding:9px 13px;font-size:11.5px}
.regrow:nth-child(even){background:var(--soft)}
.regrow .k{color:var(--muted)} .regrow .v{font-weight:600;color:var(--ink);text-align:right}
.regmap{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.regmap .cap{font-size:10.5px;color:var(--muted);text-align:center}
.leaflet-container{z-index:0}
.steps{display:flex}
.st{flex:1;padding:10px 12px;background:var(--white);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.st:first-child{border-radius:7px 0 0 7px} .st:last-child{border-radius:0 7px 7px 0}
.st+.st{border-left:0}
.st.done{background:var(--okbg);border-color:#CFE5D9;color:var(--ok);font-weight:600}
.st.now{background:var(--m-lite);border-color:#C8DDEC;color:var(--m);font-weight:600}
.st b{display:block;font-size:9.5px;opacity:.75;font-weight:500}
.stepc{display:flex;align-items:flex-start;padding:6px 4px 2px}
.stepc .scwrap{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:110px}
.stepc .sc{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:var(--muted);background:var(--white);flex:0 0 32px;transition:.15s}
.stepc .sc.done{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px}
.stepc .sc.now{background:var(--m);border-color:var(--m);color:#fff;box-shadow:0 0 0 4px var(--m-lite);transform:scale(1.12)}
.stepc .scl{font-size:10.5px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.4}
.stepc .scl.on{color:var(--ink);font-weight:700}
.stepc .scline{flex:1;height:2px;background:var(--line);margin:15px -20px 0}
.stepc .scline.done{background:var(--ok)}

.radio{display:flex;gap:10px;margin-bottom:15px}
.opt{flex:1;border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;background:var(--white)}
.opt:hover{border-color:var(--m-light)}
.opt.on{border-color:var(--m);background:var(--m-lite);box-shadow:0 0 0 2px rgba(15,92,140,.13)}
.opt .t{font-size:12.5px;font-weight:600;margin-bottom:4px}
.opt .s{font-size:11px;color:var(--muted);line-height:1.6}
.field{margin-bottom:14px;min-width:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--white);border:1px solid var(--line);
  border-radius:6px;padding:10px 12px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(15,92,140,.15)}
.field input.big{font-size:18px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.hint{font-size:10.5px;color:var(--muted);margin-top:5px}
.hint.err{color:var(--bad)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:11.5px;background:var(--white);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px}
.drop.drag{border-color:var(--m);background:var(--m-lite);color:var(--m)}
.drop:hover{border-color:var(--m);background:var(--m-lite)}
.drop .dropIcon{font-size:17px;color:var(--m)}
.drop b{color:var(--ink2);font-size:12.5px;font-weight:600}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--m-lite);border:1px solid #C8DDEC;border-radius:5px;padding:5px 10px;font-size:10.5px;color:var(--ink2)}
.chip b{color:var(--ok);margin-right:4px}
.filelist{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.filerow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.filerow .fic{width:24px;height:24px;border-radius:50%;background:var(--okbg);color:var(--ok);font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.filerow .fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.filerow .fmeta b{font-size:11.5px;color:var(--ink);font-weight:600}
.filerow .fmeta span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.filerow .frm{cursor:pointer;color:var(--muted);font-size:12.5px;padding:3px 6px;border-radius:5px;flex:0 0 auto}
.filerow .frm:hover{color:var(--bad);background:var(--badbg)}
.audit{background:var(--soft);border-radius:7px;padding:12px 14px;font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:13px}
.audit b{color:var(--ink2)}

.veil{position:fixed;inset:0;background:rgba(6,26,42,.66);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:var(--white);border-radius:11px;width:100%;max-width:440px;padding:26px;box-shadow:0 22px 60px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:5px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.otp{display:flex;gap:8px;margin-bottom:8px}
.otp input{flex:1 1 0;min-width:0;width:100%;height:48px;padding:0;border:1px solid var(--line);border-radius:7px;
  text-align:center;font-size:20px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.otp input:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(15,92,140,.15)}
.sig{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--soft);margin-bottom:16px}
.sig .nm{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink);letter-spacing:.04em}
.sig .mt{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.6}
.keys{font-size:11.5px}
.keys>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft)}
.keys>div:last-child{border:0}
.keys kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--soft);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:3px 8px;color:var(--ink2);white-space:nowrap}
.keys span{color:var(--muted)}

var $=function(s,r){return (r||document).querySelector(s)};
var fmt=function(n){return Number(n).toLocaleString('en-US')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var L=function(o){return o?(o[lang]||o.en||o.lo||''):''};
var parseD=function(s){if(!s)return 0;var p=s.split('/');return Number(p[2]+p[1]+p[0])};
function lastUpd(e){var d=e.reg;e.hist.forEach(function(h){if(parseD(h.d)>parseD(d))d=h.d});return d}
var ST={COMPLETED:['kCompleted','p-ok'],PARTIAL:['kPartial','p-warn'],PENDING:['kPending','p-idle'],OVERDUE:['kOverdue','p-bad']};
function stName(s){return ST[s]?t(ST[s][0]).split(' — ')[1]||t(ST[s][0]):s}
function pill(s){var x=ST[s]||['','p-idle'];return '<span class="pill '+x[1]+'">'+stName(s)+'</span>'}
var HST={complete:['hstComplete','p-ok'],pending:['hstPending','p-warn'],returned:['hstReturned','p-bad']};
function histPill(s){var x=HST[s]||HST.complete;return '<span class="pill '+x[1]+'">'+t(x[0])+'</span>'}
function modeLbl(m){return t(m==='cash'?'modeCash':'modeAsset')}
function toast(a,b,ok){
  var d=document.createElement('div');d.className='toast'+(ok?' ok':'');
  d.innerHTML='<b>'+a+'</b>'+(b?'<small>'+b+'</small>':'');
  $('#toasts').appendChild(d);
  setTimeout(function(){d.style.transition='.3s';d.style.opacity='0';setTimeout(function(){d.remove()},320)},4300);
}

/* ---------- donut charts (replaces all progress-bar style visuals) ---------- */
function donutPct(pct,color){
  var R=42,C=2*Math.PI*R,len=pct/100*C;
  return '<svg viewBox="0 0 100 100" style="width:118px;height:118px;flex:0 0 118px">'+
   '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="var(--soft)" stroke-width="13"/>'+
   '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+(color||'#1B6E45')+'" stroke-width="13" stroke-linecap="round" '+
   'stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" transform="rotate(-90 50 50)"/>'+
   '<text x="50" y="47" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono,monospace">'+pct+'%</text>'+
   '<text x="50" y="62" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+t('cPaid')+'</text></svg>';
}
function donutSegs(segs,centerLabel){
  var tot=segs.reduce(function(a,s){return a+s[0]},0)||1,R=48,C=2*Math.PI*R,off=0;
  var arcs=segs.map(function(s){
    var len=s[0]/tot*C;
    var d='<circle class="hv" cx="64" cy="64" r="'+R+'" fill="none" stroke="'+s[1]+'" stroke-width="17" '+
      'stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" '+
      'transform="rotate(-90 64 64)" data-tip="'+s[2]+'|'+fmt(s[0])+' ('+(s[0]/tot*100).toFixed(1)+'%)"></circle>';
    off+=len;return d}).join('');
  return '<svg viewBox="0 0 128 128" style="width:130px;height:130px;flex:0 0 130px">'+arcs+
   '<text x="64" y="60" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono,monospace">'+fmt(tot)+'</text>'+
   '<text x="64" y="76" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+(centerLabel||'')+'</text></svg>';
}
function donutLegend(segs){
  var tot=segs.reduce(function(a,s){return a+s[0]},0)||1;
  return '<div class="dlegend">'+segs.map(function(s){
    var pc=s[0]/tot*100;
    return '<div class="row"><div class="bar" style="width:'+pc.toFixed(1)+'%;background:'+s[1]+'"></div>'+
    '<i style="background:'+s[1]+'"></i><span class="nm">'+s[2]+'</span>'+
    '<span class="ct">'+fmt(s[0])+'</span><span class="pc">'+pc.toFixed(0)+'%</span></div>'}).join('')+'</div>';
}

   '<div class="hstat"><div class="k">'+t('cPaid')+'</div><div class="v">'+fmt(totalPaid)+' LAK</div></div>'+
   '</div></div>';
}
function barChart(labels,values,color,unit){
  var max=Math.max.apply(null,values)||1,W=760,H=150,PL=6,PR=6,PT=20,BASE=H-24,step=(W-PL-PR)/labels.length;
  var grid=[0.25,0.5,0.75,1].map(function(f){var y=BASE-(BASE-PT)*f;
    return '<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>'}).join('');
  var peak=values.indexOf(max);
  var bars=values.map(function(v,i){
    var bw=step*0.56,x=PL+i*step+(step-bw)/2,h=v/max*(BASE-PT);
    return '<rect class="hv" x="'+x.toFixed(1)+'" y="'+(BASE-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" '+
      'fill="url(#barGrad)" rx="4" data-tip="'+labels[i]+'|'+fmt(v)+' '+(unit||'')+'"></rect>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(BASE-h-6).toFixed(1)+'" text-anchor="middle" font-size="9.5" '+

function daysLeft(dueStr){
  var p=dueStr.split('/'),due=new Date(p[2],p[1]-1,p[0]),today=new Date(2026,7,4);

function wireDropTyped(el,f,opts,mocks){
  if(!el)return;
  var push=function(name){
    var o=opts.filter(function(x){return x.k===f.docType})[0]||opts[0];
    f.files=f.files.filter(function(x){return x.k!==o.k});
    f.files.push({k:o.k,lbl:o.lbl,name:name});
    f.docErr='';
    render();
  };
  el.onclick=function(){push(mocks[f.docType]||'document.pdf')};
  el.ondragover=function(ev){ev.preventDefault();el.classList.add('drag')};
  el.ondragleave=function(){el.classList.remove('drag')};
  el.ondrop=function(ev){ev.preventDefault();el.classList.remove('drag');
    var dt=ev.dataTransfer&&ev.dataTransfer.files;
    push(dt&&dt.length?dt[0].name:(mocks[f.docType]||'document.pdf'))};
}

function fakeQR(seed){
  var n=17,cell=10,size=n*cell,seedNum=0,i;
  for(i=0;i<seed.length;i++)seedNum+=seed.charCodeAt(i)*(i+1);
  function h(x,y){return (x*31+y*17+seedNum)%7}
  function finder(fx,fy){
    return '<rect x="'+fx+'" y="'+fy+'" width="'+(7*cell)+'" height="'+(7*cell)+'" style="fill:var(--m-dark)"/>'+
    '<rect x="'+(fx+cell)+'" y="'+(fy+cell)+'" width="'+(5*cell)+'" height="'+(5*cell)+'" fill="#fff"/>'+
    '<rect x="'+(fx+2*cell)+'" y="'+(fy+2*cell)+'" width="'+(3*cell)+'" height="'+(3*cell)+'" style="fill:var(--m-dark)"/>';
  }
  var cells='',x,y;
  for(y=0;y<n;y++){for(x=0;x<n;x++){
    var inF=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(inF)continue;
    if(h(x,y)%2===0)cells+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" style="fill:var(--m-dark)"/>';
  }}
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:180px;height:180px;background:#fff">'+
   '<rect x="0" y="0" width="'+size+'" height="'+size+'" fill="#fff"/>'+cells+
   finder(0,0)+finder((n-7)*cell,0)+finder(0,(n-7)*cell)+'</svg>';
}

  $('#frame').innerHTML=h;
  var v=$('#veil');if(v)v.remove();
  if(S.modal)document.body.insertAdjacentHTML('beforeend',vModal());
  bind();
  if(keepScroll){

    setTimeout(function(){var b=document.querySelector('.body');if(b)b.scrollTop=prevTop},0);
  }
  render._key=S.view+':'+S.mobile;
}

function otpWire(box,cb){
  var ins=box.querySelectorAll('input');
  ins.forEach(function(inp,i){
    inp.oninput=function(){inp.value=inp.value.replace(/[^0-9]/g,'');
      if(inp.value&&ins[i+1])ins[i+1].focus();
      cb(Array.prototype.every.call(ins,function(x){return x.value}))};
    inp.onkeydown=function(ev){if(ev.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()}});
  ins[0].focus();
}

function approve(i){
  var x=S.tasks[i];if(!x)return;
  var e=x.ent,before=e.status;
  e.paid+=x.amt;
  e.status=e.paid>=e.cap?'COMPLETED':'PARTIAL';
  if(e.insts[1]){e.insts[1].state='paid';
    e.insts[1].meta={lo:'ອະນຸມັດໂດຍ ຫົວໜ້າພະແນກ 04/08/2026 · ລົງລາຍເຊັນດິຈິຕອນແລ້ວ',en:'Approved by the division head on 04/08/2026 · digitally signed'}}
  e.hist.push({d:'04/08/2026',a:{lo:'ອະນຸມັດ ແລະ ລົງລາຍເຊັນດິຈິຕອນ',en:'Approved and digitally signed'},m:'',v:0,u:who().n,f:'1',ch:'',st:'complete'});
  S.notif.unshift({t:{lo:'ທຶນຈົດທະບຽນຄົບຖ້ວນແລ້ວ',en:'Registered capital fully paid'},
    s:{lo:'ອະນຸມັດແລ້ວ · ໃບຢັ້ງຢືນການຝາກທຶນພ້ອມດາວໂຫຼດ',en:'Approved · the capital deposit certificate is ready to download'},x:'10:12',c:'var(--ok)'});

}

document.addEventListener('click',function(ev){
  if((S.bell||S.umenu)&&!ev.target.closest('.bellwrap')){S.bell=false;S.umenu=false;render()}});

document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&(S.modal||S.bell||S.umenu)){S.modal=null;S.bell=false;S.umenu=false;render();return}
  if(!ev.altKey||ev.ctrlKey||ev.metaKey)return;
  var tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea')return;
  var k=ev.key.toLowerCase();
  if(k==='l'){ev.preventDefault();lang=lang==='lo'?'en':'lo';render()}

  if(dsc)dsc.onclick=function(){
    if(!(S.modal.idv||'').trim())return;
    var idv=S.modal.idv;S.modal.step='otp';render();toast(t('sendCode'),idv,true)};
  var o3=$('#otp3');if(o3)otpWire(o3,function(f){var b=$('#doVerifyCode');if(b)b.disabled=!f});
  var dvc=$('#doVerifyCode');if(dvc)dvc.onclick=function(){S.modal.step='new';render()};
  var dsp=$('#doSetPw');
  if(dsp)dsp.onclick=function(){
    var p1=$('#newPw1').value,p2=$('#newPw2').value;
    if(!p1||p1!==p2){S.modal.err=t('pwMismatch');return render()}
    S.modal=null;render();toast(t('pwResetDone'),t('pwResetDoneS'),true)};

  var nuo=$('#newUOrg');if(nuo)nuo.onchange=function(){
    S.modal.nm=$('#newUName').value;S.modal.org=nuo.value;S.modal.role=ROLE_OPT[nuo.value][0];render()};

  var dsu=$('#doSaveUser');
  if(dsu)dsu.onclick=function(){
    var nm=$('#newUName').value.trim(),org=$('#newUOrg').value,role=$('#newURole').value;
    if(!nm){S.modal.err=t('errRequired');S.modal.nm=nm;S.modal.org=org;S.modal.role=role;return render()}
    S.users.push({nm:nm,org:org,role:role,active:1,pwd:'0',online:0});
    S.modal=null;render();toast(t('userAdded'),nm,true)};

  var vfq=$('#verifyQ');
  if(vfq)vfq.oninput=function(){var p=vfq.selectionStart;S.modal.q=vfq.value;render();
    var n=$('#verifyQ');if(n){n.focus();n.setSelectionRange(p,p)}};

  var sim=$('#doSimPay');
  if(sim)sim.onclick=function(){
    var inv=S.invs.filter(function(x){return x.id===sim.dataset.inv})[0];if(!inv)return;
    var idx=S.invs.indexOf(inv);
    inv.status='PAID';inv.paidAt='04/08/2026';inv.receipt='RCP-2026-0'+(500+idx);
    inv.channel=(S.modal&&S.modal.channel)||'qr';
    S.modal={type:'receipt',inv:inv.id};render();
    toast(t('paidOk'),t('paidOkS'),true)};

  var tip=$('#tip');
  document.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('mousemove',function(ev){
      var p=el.dataset.tip.split('|');
      tip.innerHTML='<b>'+p[0]+'</b><span>'+(p[1]||'')+'</span>';
      tip.style.opacity='1';
      tip.style.left=Math.min(ev.clientX+14,window.innerWidth-210)+'px';
      tip.style.top=Math.max(8,ev.clientY-50)+'px'});
    el.addEventListener('mouseleave',function(){tip.style.opacity='0'})});
}

reset();
</script>
</body>
</html>
